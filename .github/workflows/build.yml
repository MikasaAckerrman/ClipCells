name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CLIPCELLS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clipcells.keystore"
            echo "keystore decoded: $(stat -c%s "$RUNNER_TEMP/clipcells.keystore") bytes"
          else
            echo "no signing keystore — debug signing will be used"
          fi

      - name: Unit tests (core)
        run: gradle :core:test

      - name: Assemble APKs
        run: gradle :app:assembleRelease :app:assembleDebug
        env:
          CLIPCELLS_STORE_FILE: ${{ runner.temp }}/clipcells.keystore
          CLIPCELLS_STORE_PASSWORD: ${{ secrets.CLIPCELLS_STORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCells-apk
          path: app/build/outputs/apk/**/*.apk
